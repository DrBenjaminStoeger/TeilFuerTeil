<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Teil für Teil</title>
<style>
/* Teil für Teil – Brüche addieren und subtrahieren. Gleiche Gestaltung wie Punktlandung: Kästchenpapier, dicke Konturen, Farbcode Summand 1 = blau, Summand 2 = orange. */
:root{
  --paper:#fbfcff; --grid:#dde7f6;
  --ink:#1b2a4a; --ink-soft:#4d5b78;
  --panel:#ffffff; --panel-border:#c5d2e8; --edge:rgba(27,42,74,.22);
  --hl1:#ffe14a; --hl2:#fff1a8;
  --sun:#ffd83a; --sun-ink:#1b2a4a;
  --blue:#2a56d6; --blue-ink:#ffffff;
  --ok:#157f55; --ok-bg:#def5e9;
  --bad:#c92a41; --bad-bg:#fde5e8;
  --warn:#e0a400;
  --note:#fff6bf; --note-ink:#1b2a4a; --note-edge:#e8c93a;
  --card:#ffffff; --card-ink:#1b2a4a;
  --star-off:#cdd7e8; --shade:rgba(10,20,40,.55);
  --silver:#dfe6f1; --bronze:#e9b98c; --medal-ink:#1b2a4a;
  --dough:#fff4dd; --tray:#8a96ad;
  --s1:#5b8def; --s1t:#1d50c0;
  --s2:#f39a3d; --s2t:#b25300;
  --s3:#4fb58a; --s3t:#127048;
  --font:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c352f; --grid:#25433b;
    --ink:#f3f1e7; --ink-soft:#bccbc3;
    --panel:#23413a; --panel-border:#3b5f55; --edge:rgba(0,0,0,.35);
    --hl1:rgba(242,207,74,.50); --hl2:rgba(242,207,74,.24);
    --sun:#f2cf4a; --sun-ink:#1b2a4a;
    --blue:#9dbdff; --blue-ink:#11203c;
    --ok:#74e0b0; --ok-bg:#1f4a3b;
    --bad:#ff97a4; --bad-bg:#4f2b32;
    --warn:#f2cf4a;
    --note:#4a4524; --note-ink:#f3f1e7; --note-edge:#f2cf4a;
    --card:#f6f4ea; --card-ink:#1b2a4a;
    --star-off:#3f5d54; --shade:rgba(0,0,0,.6);
    --dough:#33544b; --tray:#9fb3aa;
    --s1:#6f9cf5; --s1t:#a9c6ff;
    --s2:#f5a552; --s2t:#ffc78f;
    --s3:#5cc99a; --s3t:#8be6bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1c352f; --grid:#25433b;
  --ink:#f3f1e7; --ink-soft:#bccbc3;
  --panel:#23413a; --panel-border:#3b5f55; --edge:rgba(0,0,0,.35);
  --hl1:rgba(242,207,74,.50); --hl2:rgba(242,207,74,.24);
  --sun:#f2cf4a; --sun-ink:#1b2a4a;
  --blue:#9dbdff; --blue-ink:#11203c;
  --ok:#74e0b0; --ok-bg:#1f4a3b;
  --bad:#ff97a4; --bad-bg:#4f2b32;
  --warn:#f2cf4a;
  --note:#4a4524; --note-ink:#f3f1e7; --note-edge:#f2cf4a;
  --card:#f6f4ea; --card-ink:#1b2a4a;
  --star-off:#3f5d54; --shade:rgba(0,0,0,.6);
  --dough:#33544b; --tray:#9fb3aa;
  --s1:#6f9cf5; --s1t:#a9c6ff;
  --s2:#f5a552; --s2t:#ffc78f;
  --s3:#5cc99a; --s3t:#8be6bd;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
  font-variant-numeric:lining-nums;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.app{max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:14px 28px}
.app:has(> #home:not([hidden])){max-width:1320px}
h1,h2,h3,p,ul,ol{margin:0}
h1,h2,h3{text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* ---------- Zahlen im Text ---------- */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .12em;font-size:.86em;font-variant-numeric:lining-nums tabular-nums}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .22em .03em}
.fr>span:last-child{padding:.04em .22em 0}
.num{display:inline-flex;align-items:center;vertical-align:middle;font-weight:800;white-space:nowrap}
.num .w{font-size:1.15em;margin-right:.03em}
.num .fr{margin:0 .06em}
.c1{color:var(--s1t)} .c2{color:var(--s2t)} .c3{color:var(--s3t)}
.prose{line-height:1.7}
.op{font-weight:900;margin:0 .15em}

/* ---------- Schaltflächen ---------- */
.btn{min-height:48px;padding:0 20px;border-radius:13px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--edge);-webkit-user-select:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.quiet{border-color:var(--panel-border);box-shadow:none;font-weight:700}
.btn.small{min-height:42px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.42;cursor:default;box-shadow:none}

/* ---------- Menü ---------- */
.mhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:4px 24px;align-items:end}
@media (max-width:760px){.mhead{grid-template-columns:1fr}}
.mhead h1{font-size:clamp(36px,6vw,54px);line-height:1;letter-spacing:-.02em;font-weight:900}
.mhead .tagline{font-size:clamp(16px,2.2vw,19px);font-weight:700;color:var(--ink-soft);margin-top:6px}
.hero{display:block;width:100%;height:auto;max-height:120px}
.hero .p1{animation:slide1 1.1s cubic-bezier(.3,1.3,.5,1) .3s both}
.hero .p2{animation:slide2 1.1s cubic-bezier(.3,1.3,.5,1) .55s both}
@keyframes slide1{from{transform:translateX(-120px)}}
@keyframes slide2{from{transform:translateX(120px)}}
.mbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--panel-border)}
.mbar label{font-weight:800}
.mbar input{min-height:46px;border:2px solid var(--panel-border);border-radius:12px;background:var(--panel);padding:0 12px;font-size:17px;width:min(240px,100%)}
.rank{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:16px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 4px 0 var(--edge)}
.rank .rk{display:flex;align-items:center;gap:10px;flex:1 1 280px;min-width:0}
.rank .rk svg{width:46px;height:46px;flex:none}
.rank .rk strong{display:block;font-size:18px;line-height:1.2}
.rank .rk span{font-size:14px;color:var(--ink-soft);font-weight:700}
.rank .pbar{flex:1 1 140px;min-width:120px;max-width:260px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:999px;border:2px dashed var(--panel-border);font-size:13px;font-weight:800;color:var(--ink-soft)}
.badge i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--panel-border);color:var(--ink);font-size:13px;font-weight:900}
.badge.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--hl2)}
.badge.on i{background:var(--sun);color:var(--sun-ink)}
.resume{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--panel);border:2px solid var(--blue)}
.resume .txt{flex:1 1 260px;min-width:0}
.topics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px;align-items:start}
@media (max-width:1180px){.topics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.topics{grid-template-columns:1fr}}
.tcol{background:var(--panel);border:2px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--edge);padding:12px;display:grid;gap:7px}
.tcol-head{display:flex;align-items:flex-start;gap:9px}
.tcol-head .tn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-weight:900;flex:none}
.tcol-head h2{font-size:17.5px;font-weight:900;line-height:1.15;hyphens:manual}
.tprog{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--ink-soft)}
.pbar{flex:1;height:10px;border-radius:999px;background:var(--panel-border);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.lrow{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:52px;padding:6px 8px;border-radius:12px;border:2px solid var(--panel-border);background:var(--paper);color:var(--ink);text-align:left;cursor:pointer}
.lrow:active{transform:translateY(2px)}
.lrow .ln{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--panel-border);color:var(--ink)}
.lrow .lt{display:block;font-weight:800;font-size:15px;line-height:1.2;hyphens:manual;overflow-wrap:break-word}
.lrow .lb{font-size:12px}
.lrow.tried{border-color:var(--ink-soft)}
.lrow.done{background:var(--ok-bg);border-color:var(--ok)}
.lrow.done .ln{background:var(--ok);color:var(--paper)}
.lrow.sich{border-style:dashed;background:var(--note);color:var(--note-ink)}
.lrow.sich .ln{background:var(--note-edge);color:var(--note-ink)}
.lrow.sich.done{border-style:solid;background:var(--ok-bg);color:var(--ink)}
.lrow.rec{box-shadow:0 0 0 3px var(--blue)}
.lrow .rec-tag{position:absolute;top:-10px;right:8px;font-size:11px;font-weight:900;padding:0 8px;border-radius:999px;background:var(--blue);color:var(--blue-ink)}
.medal{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:900;font-size:12px;border:2px solid var(--ink);white-space:nowrap}
.medal.gold{background:var(--sun);color:var(--sun-ink)}
.medal.silber{background:var(--silver);color:var(--medal-ink)}
.medal.bronze{background:var(--bronze);color:var(--medal-ink)}
.medal.none{border-color:var(--panel-border);color:var(--ink-soft);font-weight:800}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:12px;border-top:2px solid var(--panel-border)}
.foot p{flex:1 1 300px;color:var(--ink-soft);font-size:15px}

/* ---------- Kopfzeile Übung ---------- */
.strip{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 7px);z-index:50;background:transparent;pointer-events:none}
.strip.green{background:var(--ok)} .strip.yellow{background:var(--warn)} .strip.red{background:var(--bad)}
.topbar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:4px 0 10px;border-bottom:2px solid var(--ink)}
.topbar .lvl{font-weight:900;font-size:17px}
.topbar .who-tag{font-weight:700;color:var(--ink-soft);font-size:14px}
.spacer{flex:1}
.pips{display:flex;gap:4px}
.pip{width:24px;height:24px;border:2px solid var(--panel-border);border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:900;background:var(--panel);color:transparent}
.pip.done{background:var(--sun);border-color:var(--ink);color:var(--sun-ink)}
.pip.now{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.starcount{display:flex;align-items:center;gap:5px;font-weight:900;font-size:18px}
.star{width:1.15em;height:1.15em;fill:var(--sun);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round;flex:none}
.star.off{fill:var(--star-off);stroke:none}
.streak{font-weight:900;font-size:14px;padding:3px 10px;border-radius:999px;background:var(--blue);color:var(--blue-ink)}
.streak.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- Aufgabe ---------- */
.steps{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.stepchip{display:flex;align-items:center;gap:7px;padding:3px 13px 3px 3px;border-radius:999px;border:2px solid var(--panel-border);background:var(--panel);color:var(--ink-soft);font-weight:800;font-size:14.5px}
.stepchip b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel-border);color:var(--ink);font-weight:900}
.stepchip.on{border-color:var(--ink);color:var(--ink)}
.stepchip.on b{background:var(--blue);color:var(--blue-ink)}
.stepchip.past b{background:var(--ok);color:var(--paper)}
.task{margin-top:8px}
.task .kicker{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--hl2);color:var(--ink)}
.task h2{font-size:clamp(22px,3.1vw,28px);font-weight:900;line-height:1.3;margin-top:4px}
.task p{max-width:72ch;margin-top:4px;font-size:18px;line-height:1.6}
.pic{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:10px}
.pic:empty{display:none}
.pic .opbig,.opbig{font-size:34px;font-weight:900;line-height:1}
.fig{display:flex;flex-direction:column;align-items:center;gap:2px}
.fig .cap{font-size:20px;font-weight:800;min-height:1.6em;display:flex;align-items:center;gap:4px}
.blech{display:block;overflow:visible}
.blech .cell{fill:var(--dough);stroke:var(--ink);stroke-width:1.2}
.blech .cell.f1{fill:var(--s1)} .blech .cell.f2{fill:var(--s2)} .blech .cell.f3{fill:var(--s3)}
.blech .cut{stroke:var(--ink);stroke-width:2.6}
.blech .fine{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 3}
.blech .rim{fill:none;stroke:var(--ink);stroke-width:3.4}
.blech .pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0}}
.blech .tap{cursor:pointer}
.blech .tap:hover{opacity:.82}
.blech text{fill:var(--ink);font-weight:800;font-family:var(--font)}
.blech .cupline{stroke:var(--ink);stroke-width:1.6}
.blech .water1{fill:var(--s1)} .blech .water2{fill:var(--s2)}
.blech .glass{fill:none;stroke:var(--ink);stroke-width:3}

/* ---------- Arbeitsschritte ---------- */
.stp{margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--panel);border:2px solid var(--ink);box-shadow:0 5px 0 var(--edge)}
.stp.done{box-shadow:none;border-color:var(--panel-border);border-style:dashed;padding:8px 14px}
.stp .sq{font-weight:800;font-size:18px;line-height:1.55;max-width:72ch}
.stp.done .sq{font-size:15px;color:var(--ink-soft)}
.stp .sq::before{content:attr(data-n);display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:var(--blue-ink);font-size:14px;font-weight:900;margin-right:8px;vertical-align:2px}
.stp.done .sq::before{content:"✓";background:var(--ok);color:var(--paper)}
.stp .body{margin-top:8px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opts.wide{grid-template-columns:1fr}
.opt{min-height:54px;text-align:left;padding:8px 14px;border-radius:13px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font-size:17px;font-weight:700;line-height:1.55;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.opt[aria-pressed="true"]{background:var(--hl1);box-shadow:0 0 0 3px var(--blue)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:none;cursor:default}
.calcbox{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.calc-math{display:grid;gap:12px;font-size:28px;font-weight:800;flex:1 1 380px;min-width:0;font-variant-numeric:tabular-nums}
.stp.done .calc-math{font-size:22px;gap:6px}
.cl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.cl .lbl{font-size:17px;font-weight:800;color:var(--ink-soft)}
.cl .eq{font-weight:900}
.F{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.F>.fb{align-self:stretch;height:3px;background:currentColor;border-radius:2px;margin:4px 0}
.M{display:inline-flex;align-items:center;gap:4px}
.g{padding:0 4px}
.arr{font-size:15px;font-weight:900;color:var(--ink-soft);padding:0 2px}
.nslot{min-width:54px;height:50px;padding:0 6px;border:2.5px solid var(--ink-soft);border-radius:10px;background:var(--paper);font-size:26px;font-weight:800;color:var(--ink);cursor:pointer;vertical-align:middle}
.nslot.sm{min-width:40px;height:42px;font-size:21px}
.nslot.active{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue)}
.nslot.bad{border-color:var(--bad);background:var(--bad-bg)}
.nslot.ok{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.sv{display:inline-grid;place-items:center;min-width:34px;padding:0 4px;border-radius:8px;background:var(--ok-bg);color:var(--ink)}
.numpad{display:grid;grid-template-columns:repeat(3,60px);gap:6px}
.numpad button{height:52px;border-radius:10px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--edge);padding:0}
.numpad button:active{transform:translateY(2px);box-shadow:none}
.numpad .fn{font-size:13px;line-height:1.1}
.numpad .wide{grid-column:span 3;height:44px}
/* Verfeinern */
.refine{display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-start}
.rbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.rbox .cap{font-size:22px;font-weight:800;display:flex;align-items:center;gap:4px}
.stepper{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.stepper button{width:46px;height:46px;border-radius:11px;border:2px solid var(--ink);background:var(--paper);font-size:24px;font-weight:900;cursor:pointer;padding:0;box-shadow:0 2px 0 var(--edge)}
.stepper b{min-width:30px;text-align:center;font-size:22px}
.pcount{font-size:15px;font-weight:800;color:var(--ink-soft)}
.pcount.same{color:var(--ok)}
/* Karten / Lücken */
.cardline{font-size:26px;font-weight:800;line-height:2.3;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cloze{font-size:19px;line-height:2.5;font-weight:600;max-width:72ch}
.gap{min-width:76px;min-height:46px;padding:0 10px;margin:0 3px;border:none;border-bottom:3px solid var(--ink);border-radius:8px 8px 0 0;background:var(--paper);font-weight:800;font-size:19px;cursor:pointer;vertical-align:middle}
.gap.big{min-width:58px;min-height:58px;border:2.5px dashed var(--ink-soft);border-radius:12px;font-size:26px}
.gap.active{box-shadow:0 0 0 3px var(--blue)}
.gap.hover{background:var(--hl2)}
.gap.bad{background:var(--bad-bg);border-color:var(--bad)}
.gap.ok{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;min-height:56px;padding:10px;border-radius:14px;border:2px dashed var(--panel-border)}
.chip{min-height:48px;min-width:48px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--card-ink);font-weight:800;font-size:19px;cursor:grab;touch-action:none;box-shadow:0 3px 0 var(--edge);-webkit-user-select:none;user-select:none}
.chip.drag{position:fixed;z-index:80;pointer-events:none;box-shadow:0 8px 18px var(--edge)}
/* Zahlenmauer, Zauberquadrat */

/* Schriftliche Addition */

/* Musterlösung */
.worked{display:grid;gap:8px;font-size:24px;font-weight:800}

.worked .wl:nth-child(2){animation-delay:.6s} .worked .wl:nth-child(3){animation-delay:1.2s} .worked .wl:nth-child(4){animation-delay:1.8s}

.speech{position:relative;display:inline-block;margin-top:6px;padding:10px 16px;border-radius:16px;border:2px solid var(--ink);background:var(--card);color:var(--card-ink);font-size:22px;font-weight:800}

/* ---------- Rückmeldung ---------- */
.feedback{margin-top:12px;min-height:58px;padding:9px 14px;border-radius:13px;border:2px solid transparent;font-size:17px;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;line-height:1.6}

.won{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.won .stars{display:flex;gap:4px;font-size:32px}
.won .stars .star:not(.off){animation:starin .45s cubic-bezier(.3,1.6,.5,1) both}
.won .stars .star:nth-child(2){animation-delay:.15s}
.won .stars .star:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}}
.won strong{font-size:20px}
.won>div:last-child{flex:1 1 260px;min-width:0}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.hint{margin-top:14px;padding:14px 16px;border-radius:6px 14px 14px 6px;background:var(--note);color:var(--note-ink);border-left:8px solid var(--note-edge);max-width:820px}

.summary{max-width:780px;position:relative;padding-top:14px}

<script>
'use strict';
/* ================= Helfer ================= */
const $ = id => document.getElementById(id);
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const KIDS = ['Mia', 'Ben', 'Lea', 'Can', 'Emma', 'Noah', 'Lina', 'Tom', 'Aylin', 'Jonas', 'Sofia', 'Elias'];
const kid = () => pick(KIDS);
const DN = ['', 'Ganze', 'Halbe', 'Drittel', 'Viertel', 'Fünftel', 'Sechstel', 'Siebtel', 'Achtel', 'Neuntel', 'Zehntel', 'Elftel', 'Zwölftel', 'Dreizehntel', 'Vierzehntel', 'Fünfzehntel', 'Sechzehntel', 'Siebzehntel', 'Achtzehntel', 'Neunzehntel', 'Zwanzigstel'];
const dname = d => DN[d] || ({24:'Vierundzwanzigstel', 30:'Dreißigstel', 36:'Sechsunddreißigstel', 40:'Vierzigstel', 60:'Sechzigstel'}[d] || d + 'tel');

/* Kuchenblech: n Stücke als senkrechte (v) oder waagerechte (h) Streifen, jedes Stück k-fach verfeinert.
   fills: [[Anzahl feiner Stücke, Klasse]] der Reihe nach; cells: Klassen je Stück (überschreibt fills). */
function blech(o){
  const {n, dir = 'v', k = 1, w = 150, h = 96, fills = [], cells = null, tap = '', pop = -1, lab = '', skin = ''} = o;
  const cols = dir === 'vv' ? n * k : dir === 'v' ? n : k, rows = dir === 'vv' ? 1 : dir === 'v' ? k : n, tot = cols * rows, cw = w / cols, ch = h / rows;
  let cls = cells;
  if (!cls){ cls = Array(tot).fill(''); let i = 0; fills.forEach(([c, f]) => { for (let j = 0; j < c && i < tot; j++) cls[i++] = f; }); }
  let s = `<svg class="blech${skin ? ' sk sk-' + skin : ''}" viewBox="-4 -4 ${w + 8} ${h + 8}" width="${w + 8}" height="${h + 8}" role="img" aria-label="${lab || (skin === 'pizza' ? 'Blechpizza' : skin ? 'Kuchenblech' : 'Rechteck')}"${tap ? ` data-s="${tap}"` : ''}>`;
  for (let i = 0; i < tot; i++){
    const c = dir !== 'h' ? Math.floor(i / rows) : i % cols, r = dir !== 'h' ? i % rows : Math.floor(i / cols);
    s += `<rect class="cell${cls[i] ? ' ' + cls[i] : ''}${tap && cls[i] ? ' tap' : ''}${i === pop ? ' pop' : ''}" x="${(c * cw).toFixed(2)}" y="${(r * ch).toFixed(2)}" width="${cw.toFixed(2)}" height="${ch.toFixed(2)}" data-i="${i}"/>`;
    if (cls[i] && cls[i].includes('fx')){ const x0 = c * cw, y0 = r * ch, m = Math.min(cw, ch) * .28, cx = x0 + cw / 2, cy = y0 + ch / 2; s += `<path class="x" d="M${(cx - m).toFixed(1)} ${(cy - m).toFixed(1)}L${(cx + m).toFixed(1)} ${(cy + m).toFixed(1)}M${(cx + m).toFixed(1)} ${(cy - m).toFixed(1)}L${(cx - m).toFixed(1)} ${(cy + m).toFixed(1)}"/>`; }
  }
  for (let c = 1; c < cols; c++) s += `<line class="${dir === 'vv' ? (c % k ? 'fine' : 'cut') : dir === 'v' ? 'cut' : 'fine'}" x1="${(c * cw).toFixed(2)}" y1="0" x2="${(c * cw).toFixed(2)}" y2="${h}"/>`;
  for (let r = 1; r < rows; r++) s += `<line class="${dir === 'h' ? 'cut' : 'fine'}" x1="0" y1="${(r * ch).toFixed(2)}" x2="${w}" y2="${(r * ch).toFixed(2)}"/>`;
  return s + `<rect class="rim" x="0" y="0" width="${w}" height="${h}" rx="5"/>${skin ? `<rect class="rim2" x="-2.5" y="-2.5" width="${w + 5}" height="${h + 5}" rx="7"/>` : ''}</svg>`;
}
/* Mehrere Bleche nacheinander füllen (für Ergebnisse > 1) */
function bleche(n, fills, o = {}){
  const k = o.k || 1, cap = n * k; let tot = fills.reduce((s, f) => s + f[0], 0);
  const cnt = Math.max(o.min || 1, Math.ceil(tot / cap)); const out = []; const q = fills.map(f => f.slice());
  for (let b = 0; b < cnt; b++){
    const fl = []; let room = cap;
    while (room > 0 && q.length){ const f = q[0], t = Math.min(room, f[0]); if (t > 0) fl.push([t, f[1]]); f[0] -= t; room -= t; if (f[0] <= 0) q.shift(); }
    out.push(blech(Object.assign({}, o, {n, k, fills: fl})));
  }
  return out.join('');
}
/* Pizza: n Stücke als Kreissektoren */
function pizza(o){

  let s = `<svg class="blech" viewBox="-4 -4 ${2 * r + 8} ${2 * r + 8}" width="${2 * r + 8}" height="${2 * r + 8}" role="img" aria-label="${lab || 'Pizza'}">`;
  if (n === 1) s += `<circle class="cell${cls[0] ? ' ' + cls[0] : ''}" cx="${r}" cy="${r}" r="${r}"/>`;
  else for (let i = 0; i < n; i++){
    const a0 = 2 * Math.PI * i / n - Math.PI / 2, a1 = 2 * Math.PI * (i + 1) / n - Math.PI / 2;

    s += `<path class="cell${cls[i] ? ' ' + cls[i] : ''}" d="M${r} ${r}L${p(a0)}A${r} ${r} 0 ${n === 2 ? 1 : 0} 1 ${p(a1)}Z"/>`;
    s += `<line class="cut" x1="${r}" y1="${r}" x2="${p(a0).split(' ')[0]}" y2="${p(a0).split(' ')[1]}"/>`;
  }

}
/* Messbecher 1 Liter mit Strichen in n Teilen, gefüllt a/n */

/* Uhr: Minuten m1 (blau) und m2 (orange) */
function uhr(m1, m2){
  const r = 56; let s = `<svg class="blech" viewBox="-4 -4 ${2 * r + 8} ${2 * r + 8}" width="${2 * r + 8}" height="${2 * r + 8}" role="img" aria-label="Uhr">`;
  const P = m => { const a = 2 * Math.PI * m / 60 - Math.PI / 2; return `${(r + r * Math.cos(a)).toFixed(2)} ${(r + r * Math.sin(a)).toFixed(2)}`; };
  s += `<circle class="cell" cx="${r}" cy="${r}" r="${r}"/>`;
  const sec = (a, b, c) => b - a >= 60 ? `<circle class="cell ${c}" cx="${r}" cy="${r}" r="${r}"/>` : `<path class="cell ${c}" d="M${r} ${r}L${P(a)}A${r} ${r} 0 ${b - a > 30 ? 1 : 0} 1 ${P(b)}Z"/>`;
  if (m1) s += sec(0, Math.min(m1, 60), 'f1');
  if (m2) s += sec(m1 % 60, Math.min(m1 % 60 + m2, 60), 'f2');

  for (let i = 0; i < 12; i++){ const a = 2 * Math.PI * i / 12 - Math.PI / 2; s += `<line class="cut" x1="${(r + (r - 8) * Math.cos(a)).toFixed(1)}" y1="${(r + (r - 8) * Math.sin(a)).toFixed(1)}" x2="${(r + r * Math.cos(a)).toFixed(1)}" y2="${(r + r * Math.sin(a)).toFixed(1)}"/>`; }
  return s + `<circle class="rim" cx="${r}" cy="${r}" r="${r}"/><circle cx="${r}" cy="${r}" r="4" fill="var(--ink)"/></svg>`;
}
/* Maßband: Teile [[Länge, Klasse]] auf einer Gesamtlänge tot (Ticks alle step) */
function band(parts, tot, step, unit, labs){

  slots(st, done){

/* ================= Eingaben ================= */
function numKey(k){
  if (G.done) return; const st = cur(); if (st.type !== 'slots') return; st.touched = true;
  if (k === 'next'){ moveAct(st, 1); return renderWork(); }
  let v = st.vals[st.act] ?? '';
  if (st.state[st.act] === 'ok') return;
  if (k === 'del') v = v.slice(0, -1);
  else if (k === ','){ if (st.pad !== 'dec' || v.includes(',')) return; v = (v === '' ? '0' : v) + ','; }
  else { const mx = st.max || (st.pad === 'dec' ? 6 : 3); if (v === '0') v = k; else if (v.length < mx) v += k; else if (mx === 1) v = k; }
  st.vals[st.act] = v; if (st.state[st.act] === 'bad') st.state[st.act] = '';
  if (st.max === 1 && /\d/.test(k)) moveAct(st, st.dir || 1, true);
  renderWork();
}
function moveAct(st, dir, noWrap){
  const n = st.n; for (let s = 1; s <= n; s++){ let j = st.act + dir * s; if (noWrap && (j < 0 || j >= n)) return; j = (j % n + n) % n; if (st.state[j] !== 'ok'){ st.act = j; return; } }
}
function fillGap(k, ci){
  const st = cur(); if (k == null || st.okg.includes(k)) k = firstFree(st); if (k < 0) return;
  const prev = st.fill.indexOf(ci); if (prev >= 0) st.fill[prev] = null;
  st.fill[k] = ci; st.bad = st.bad.filter(x => x !== k); const nx = firstFree(st); st.act = nx < 0 ? null : nx; renderWork();
}
function firstFree(st){ for (let k = 0; k < st.n; k++) if (st.fill[k] == null && !st.okg.includes(k)) return k; return -1; }
$('work').addEventListener('click', e => {

  if (o && st.type === 'choice'){ const i = +o.dataset.o; if (st.multi){ st.sel = st.sel.includes(i) ? st.sel.filter(x => x !== i) : st.sel.concat(i); } else st.sel = [i]; st.bad = []; renderWork(); return; }
  const s = e.target.closest('.nslot[data-s]'); if (s && st.type === 'slots'){ st.act = +s.dataset.s; renderWork(); return; }
  const k = e.target.closest('.numpad button'); if (k){ numKey(k.dataset.k); return; }
  const g = e.target.closest('.gap[data-g]'); if (g && st.type === 'cards'){ const i = +g.dataset.g; if (st.okg.includes(i)) return; if (st.fill[i] != null){ st.fill[i] = null; st.bad = st.bad.filter(x => x !== i); } st.act = i; renderWork(); return; }
  const c = e.target.closest('.chip[data-c]'); if (c && st.type === 'cards' && e.detail === 0){ fillGap(st.act, +c.dataset.c); return; }

  const tc = e.target.closest('rect.tap'); if (tc && st.type === 'take'){ const i = +tc.dataset.i; if (st.cells[i].includes('fx')){ st.cells[i] = 'f1'; st.taken--; } else if (st.taken < st.b){ st.cells[i] = 'f1 fx'; st.taken++; } else { fb('info', `Es sollen nur ${st.b} ${st.b === 1 ? 'Stück' : 'Stücke'} weggenommen werden. Tippe ein durchgestrichenes Stück an, um es zurückzulegen.`); return; }
    if (st.taken === st.b){ renderWork(); setTimeout(() => { if (cur() === st && st.taken === st.b) stepOk(st.okMsg || 'Die Stücke sind weggenommen.'); }, 500); } else renderWork(); return; }

document.addEventListener('keydown', e => {
  if (!G || $('play').hidden || document.querySelector('dialog[open]')) return;

/* ================= Prüfen ================= */
function fb(kind, html){ const f = $('fb'); f.className = 'feedback ' + kind; f.innerHTML = `<span>${html}</span>`; }
const CHECK = {
  show: () => ({ok: true}),
  merge: () => null,
  take: () => null,
  choice(st){
    if (!st.sel.length){ fb('info', 'Wähle zuerst eine Antwort aus.'); return null; }
    if (st.multi){
      const want = st.opts.map((o, i) => o.ok ? i : -1).filter(i => i >= 0);
      const wrong = st.sel.filter(i => !st.opts[i].ok), miss = want.filter(i => !st.sel.includes(i));
      if (!wrong.length && !miss.length){ st.chosen = st.sel.slice(); return {ok: true, msg: st.okMsg}; }
      st.bad = wrong; const w = wrong.length ? st.opts[wrong[0]] : null;
      return {msg: w?.why || (miss.length ? 'Es fehlt noch etwas – es gibt mehr richtige Antworten.' : 'Das stimmt noch nicht.'), mis: w?.mis || st.mis};
    }
    const i = st.sel[0], o = st.opts[i];
    if (o.ok || o.soft){ st.chosen = [i]; return {ok: true, msg: o.why || st.okMsg}; }
    st.bad = [i]; return {msg: o.why || 'Das stimmt noch nicht.', mis: o.mis || st.mis};
  },
  slots(st){
    if (Array.from({length: st.n}, (_, k) => st.vals[k] ?? '').some(v => v === '' || v === '0,')){ fb('info', 'Fülle zuerst alle Felder aus. Tippe ein Feld an und benutze die Zifferntasten.'); return null; }
    const v = Array.from({length: st.n}, (_, k) => st.vals[k]);
    let r = st.check ? st.check(v, st, G.t) : defCheck(v, st);
    if (!r || r.ok){ st.state = v.map(() => 'ok'); return {ok: true, msg: r?.msg || st.okMsg}; }
    st.state = v.map((_, k) => (!r.bad || r.bad.includes(k)) ? 'bad' : '');
    if (r.bad && r.bad.length) st.act = r.bad[0];
    return r;
  },
  cards(st){
    if (firstFree(st) >= 0){ fb('info', 'Lege zuerst in jede Lücke eine Karte.'); return null; }
    const v = st.fill.map(ci => st.key[ci]);
    const r = st.check ? st.check(v, st) : (() => { const bad = st.sol.map((s, k) => String(s) === String(v[k]) ? -1 : k).filter(k => k >= 0); return bad.length ? {bad, msg: `${bad.length === 1 ? 'Eine Lücke stimmt' : bad.length + ' Lücken stimmen'} noch nicht. Tippe rot markierte Lücken an, um sie zu leeren.`, mis: st.mis || 'merk'} : {ok: true}; })();
    if (r.ok){ st.okg = v.map((_, k) => k); return r; }
    st.bad = r.bad || v.map((_, k) => k); st.okg = v.map((_, k) => k).filter(k => !st.bad.includes(k) && st.keepOk !== false);

  },
  refine(st){
    const pa = st.A[1] * st.kA, pb = st.B[1] * st.kB, L = lcm(st.A[1], st.B[1]);
    if (st.kA === 1 && st.kB === 1 && pa !== pb) return {msg: 'Benutze die Tasten + und −: Teile die Stücke so lange weiter, bis beide Bleche gleich viele Stücke haben.', mis: 'hn'};
    if (pa !== pb) return {msg: `Links sind es ${pa} Stücke, rechts ${pb}. Gleich groß sind die Stücke erst, wenn beide Bleche gleich viele Stücke haben.`, mis: 'hn'};
    if (pa > L) return {noerr: true, msg: `Richtig, die Stücke sind gleich groß – ${pa} auf jedem Blech. Es geht aber auch mit weniger Stücken. Drücke − und probiere, wie wenige reichen.`};
    G.t.D = pa;
    return {ok: true, msg: `Beide Bleche haben jetzt ${pa} gleich große Stücke – ${dname(pa)}.`};
  }
};
function defCheck(v, st){
  const bad = st.sol.map((s, k) => (st.pad === 'dec' ? thou(v[k]) === thou(s) : iv(v[k]) === +s) ? -1 : k).filter(k => k >= 0);

}
function check(){
  if (!G || G.done) return; const st = cur();

  if (r.ok) return stepOk(r.msg, r.soft);
  if (r.noerr){ renderWork(); fb('info', r.msg); return; }
  G.err++; G.fails++; if (r.mis) addMis(r.mis);
  let extra = '';
  if (G.fails >= 2 && hintsOf().length){ const nt = Math.min(hintsOf().length, G.fails - 1); if (nt > G.tier){ G.tier = nt; if (G.tier >= hintsOf().length) G.sol = true; } extra = ' <b>Unten steht ein Tipp für dich.</b>'; }

function finishTask(msg){

  G.res.push(n); DB.tasks++;

/* ================= Rechen- und Prüfhilfen ================= */
const OK = {ok: true};
const opv = (a, b, s) => s === '+' ? a + b : a - b;
const ow = s => s === '+' ? '+' : '−';
const sgn = s => op(ow(s));
const U = u => u ? `<span class="unit">${u}</span>` : '';
const eqE = (x, k = 'E') => `<span class="eqx"><span class="ab">${k}${x}</span><span class="eqs">=</span></span>`;
const bigger = (A, B) => A[0] / A[1] >= B[0] / B[1] ? A : B;

const needTidy = (N, D) => N >= D || gcd(N, D) > 1;
const verb = s => s === '+' ? 'Addiere' : 'Subtrahiere';
const GD = [3, 4, 5, 6, 8, 10];
const PAIR_DIV = [[2, 4], [2, 6], [3, 6], [4, 8], [2, 8], [3, 9], [5, 10], [4, 12]];
const PAIR_CO = [[2, 3], [2, 5], [3, 4], [3, 5], [4, 5], [2, 7]];
const PAIR_SH = [[4, 6], [6, 8], [4, 10], [6, 9], [8, 12], [6, 10], [9, 12], [10, 15]];
function fracPair(pool, o = {}){
  for (let t = 0; t < 300; t++){
    const [b, d] = shuffle(pick(pool).slice()); const a = rnd(1, b - 1), c = rnd(1, d - 1);
    if (gcd(a, b) !== 1 || gcd(c, d) !== 1) continue;
    let A = [a, b], B = [c, d];
    if (o.sub){ if (a / b === c / d) continue; if (a / b < c / d) [A, B] = [B, A]; if (A[0] / A[1] - B[0] / B[1] < .05) continue; }
    const s = A[0] / A[1] + B[0] / B[1];
    if (!o.sub && o.lt1 && s >= 1) continue; if (!o.sub && o.gt1 && s <= 1) continue;
    return [A, B];
  }
  return o.sub ? [[3, 4], [1, 3]] : [[1, 2], [1, 3]];
}
/* Kontexte sollen sich nicht wiederholen: in der Runde nie, über Runden möglichst nicht */
function ctxPick(list){

  steps.push({type: 'slots', label: 'Gemischte Zahl', q: 'Schreibe als gemischte Zahl.', tpl: S => cl(...term, EQ, M(S(), F(S(), S()))), sol: [n, a, b], check: v => chkMix(+v[0], +v[1], +v[2], N, b, [0, 1, 2]) || OK,
    hints: [`Es sind ${n} ganze Bleche und noch ${fr(a, b)}.`, `Eine gemischte Zahl schreibt die Ganzen vor den Bruch.`, `= ${mx(n, a, b)}`]});
  return {kick: i === 0 ? 'Entdecken' : '', title: 'Ganze und Bruch', text: i === 0 ? `Auf dem Tisch ${n === 1 ? 'steht eine ganze Salamipizza' : `stehen ${n} ganze Salamipizzen`}. Von der Gemüsepizza ${a === 1 ? 'ist' : 'sind'} noch ${fr(a, b, 'c2')} übrig. Wie viel Pizza ist das zusammen?` : `Es sind ${n} ${n === 1 ? 'Ganzes' : 'Ganze'} und noch ${fr(a, b, 'c2')}.`, pic: picNat(n, [a, b], rev, i === 0 ? 'pizza' : ''), steps};
}
function tA2Conflict(){
  const n = rnd(2, 4), b = pick([5, 6, 8]), a = rnd(1, b - 1 - n > 0 ? b - 1 - n : 1), who = kid();
  return {kick: 'Fehlerdetektiv', title: `${who} rechnet ${n} + ${fr(a, b)}`, pic: `<div class="speech"><small>${who}:</small>${n} + ${fr(a, b)} = ${fr(n + a, b)}</div>` + picNat(n, [a, b]),
    steps: [{type: 'choice', label: 'Prüfen', q: 'Kann das stimmen?', wide: true, opts: [
      {h: `Nein. Schon ${n} allein ist mehr als ${fr(n + a, b)}.`, ok: true},
      {h: `Ja, ${n} + ${a} = ${n + a}, der Nenner bleibt.`, mis: 'A2', why: `${n} bedeutet ${n} ganze Bleche, nicht ${n} ${dname(b)}!`},
      {h: `Ja, weil man natürliche Zahlen zum Zähler addiert.`, mis: 'A2', why: `Schau aufs Bild: ${fr(n + a, b)} ist ${n + a < b ? 'weniger als ein Blech' : 'nur wenig mehr als ein Blech'}.`}],
      hints: ['Wie viele volle Bleche sind es? Und wie viel ist ' + fr(n + a, b) + '?']},
      {type: 'slots', label: 'Verbessern', q: 'Rechne richtig.', tpl: S => cl(n, op('+'), F(a, b), EQ, F(S(), b), op('+'), F(a, b), EQ, F(S(), S())), sol: [n * b, n * b + a, b],
        check: v => { if (+v[0] !== n * b) return {bad: [0], mis: 'einb', msg: `Wie viele ${dname(b)} sind ${n} Ganze?`}; return same(+v[1], +v[2], n * b + a, b) ? OK : {bad: [1, 2], msg: 'Addiere die Zähler.', mis: 'rech'}; },
        hints: [`${n} = ${fr(n * b, b)}`, `${fr(n * b, b)} + ${fr(a, b)} = ${fr(n * b + a, b)}`]}]};
}

const medalOf = s => s >= 15 ? 'gold' : s >= 12 ? 'silber' : s >= 8 ? 'bronze' : '';

const earned = () => BADGES.filter(b => b.t()).map(b => b.n);
function cake(lv){
  let s = '<svg viewBox="0 0 46 46" aria-hidden="true">';
  for (let i = 0; i < 5; i++){ const h = 8 + i * 7; s += `<rect x="${3 + i * 8.4}" y="${42 - h}" width="7" height="${h}" rx="2" fill="${i <= lv ? 'var(--blue)' : 'var(--panel-border)'}" stroke="var(--ink)" stroke-width="${i <= lv ? 1.4 : 0}"/>`; }
  return s + '</svg>';
}

    const done = c.lessons.filter(id => (DB.best[id] || 0) >= 8).length;
    return `<section class="tcol" aria-labelledby="ch${ci}"><div class="tcol-head"><span class="tn">${ci + 1}</span><h2 id="ch${ci}">${c.name}</h2></div>
      <div class="tprog"><div class="pbar"><i style="width:${Math.round(done / c.lessons.length * 100)}%"></i></div><span>${done}/${c.lessons.length}</span></div>
      ${c.lessons.map((id, li) => { const L = LES[id], b = DB.best[id] || 0, m = medalOf(b);
        return `<button type="button" class="lrow${L.test ? ' test' : ''}${m ? ' done' : DB.plays[id] ? ' tried' : ''}${id === rec ? ' rec' : ''}" data-l="${id}"><span class="ln">${L.test ? '✓' : li + 1}</span><span class="lt">${L.name}</span><span class="lb">${m ? `<span class="medal ${m}">${MEDAL[m]}</span>` : DB.plays[id] ? `<span class="medal none">${b}★</span>` : ''}</span>${id === rec ? '<span class="rec-tag">als Nächstes</span>' : ''}</button>`; }).join('')}</section>`;
  }).join('');
  show('home');
}
$('home').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (b) startLesson(b.dataset.l); });
$('name').addEventListener('input', e => { DB.name = e.target.value.trim().slice(0, 30); save(); });
$('bBack').addEventListener('click', () => { renderHome(); window.scrollTo({top: 0}); });

/* ================= Auswertung ================= */
function showSummary(){
  const id = G.id, L = G.L, tot = G.res.reduce((a, b) => a + b, 0), m = medalOf(tot);
  const before = earned(), prev = DB.best[id] || 0;
  if (tot > prev) DB.best[id] = tot;
  DB.log.unshift({d: Date.now(), id, s: tot, mis: G.mis}); DB.log = DB.log.slice(0, 80); save();
  const fresh = earned().filter(n => !before.includes(n));
  const top = Object.entries(G.mis).filter(([k]) => k !== 'rech').sort((a, b) => b[1] - a[1])[0];
  const adv = tot === 15 ? 'Alles fehlerfrei – stark!' : top ? `<b>Tipp für dich:</b> ${MIS[top[0]].kid}` : tot >= 12 ? 'Sehr gut! Nur kleine Patzer.' : 'Übe die Lektion noch einmal – mit jedem Durchgang wird es leichter.';
  const nx = ORDER[ORDER.indexOf(id) + 1];
  $('sum').innerHTML = `<p class="where">Kapitel ${L.ch + 1} · ${L.name.replace(/­/g, '')}</p><h1>${m ? MEDAL[m] + '-Medaille!' : 'Runde geschafft!'}</h1>
    <div class="total"><span class="big">${star(true)}${tot}<small style="font-size:22px;color:var(--ink-soft)"> / 15</small></span>${m ? `<span class="medal ${m}" style="font-size:18px">${MEDAL[m]}</span>` : `<span>Noch ${8 - tot} Sterne bis Bronze</span>`}${tot > prev && prev ? '<span class="medal none">neuer Bestwert</span>' : ''}</div>
    <div class="per">${G.res.map((n, i) => `<div>Aufgabe ${i + 1}<div class="stars">${stars(n)}</div></div>`).join('')}</div>
    <p class="advice">${adv}</p>
    ${fresh.length ? `<p class="advice"><b>Neues Abzeichen:</b> ${fresh.join(', ')}</p>` : ''}
    <div class="merk"><b>Merkkasten</b><br>${CH[L.ch].merk}</div>
    <div class="actions"><button class="btn" type="button" data-a="again">Nochmal</button>${nx ? `<button class="btn primary" type="button" data-a="next">Weiter: ${LES[nx].name.replace(/­/g, '')}</button>` : ''}<button class="btn quiet" type="button" data-a="home">Zum Menü</button></div>`;
  show('sum'); window.scrollTo({top: 0});
  if (m === 'gold' || m === 'silber' || fresh.length) confetti();
  if (fresh.length) toast('Neues Abzeichen: ' + fresh.join(', '));
}
$('sum').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a === 'again') startLesson(G.id); else if (a === 'next') startLesson(ORDER[ORDER.indexOf(G.id) + 1]); else renderHome(); });
function confetti(){
  const c = document.createElement('div'); c.className = 'confetti'; const cols = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--sun)', 'var(--bad)'];
  for (let i = 0; i < 70; i++){ const p = document.createElement('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % 5]; p.style.animationDelay = Math.random() * .8 + 's'; p.style.animationDuration = 1.8 + Math.random() * 1.4 + 's'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
}
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3300); }

/* ================= Merkheft ================= */
let merkTab = 0;
function renderMerk(){
  $('merkTabs').innerHTML = CH.map((c, i) => `<button class="btn small" type="button" data-t="${i}" aria-pressed="${i === merkTab}">${i + 1} ${c.name.replace(/­/g, '')}</button>`).join('');
  const c = CH[merkTab];
  $('merkBody').innerHTML = `<h3>${merkTab + 1}. ${c.name.replace(/­/g, '')}</h3><div class="mk">${c.merk}</div><p style="margin-top:12px"><b>${c.warn}</b></p>`;
}
$('merkTabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b){ merkTab = +b.dataset.t; renderMerk(); } });
$('bMerk').addEventListener('click', () => { merkTab = Math.max(0, DB.last ? LES[DB.last].ch : 0); renderMerk(); $('dMerk').showModal(); });
document.querySelectorAll('dialog').forEach(d => { d.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === d) d.close(); }); });

/* ================= Lehrkraft ================= */
const TEACHER_CODE = '7294';
function renderPin(msg){
  $('teachBody').innerHTML = `<p>Dieser Bereich ist für Lehrkräfte. Bitte den Code eingeben.</p><form class="pin" id="pinF"><input id="pinI" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="Lehrkraftcode"><button class="btn primary" type="submit">Öffnen</button></form>${msg ? `<p style="color:var(--bad);font-weight:800">${msg}</p>` : ''}`;
  $('pinF').addEventListener('submit', e => { e.preventDefault(); if ($('pinI').value === TEACHER_CODE) renderTeacher(); else renderPin('Der Code stimmt nicht.'); });
  setTimeout(() => $('pinI')?.focus(), 50);
}
function renderTeacher(confirmReset){
  const mis = Object.entries(DB.mis).sort((a, b) => b[1] - a[1]);
  const date = t => new Date(t).toLocaleString('de-DE', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
  $('teachBody').innerHTML = `<p><b>${DB.name || 'Ohne Namen'}</b> · ${DB.tasks} Aufgaben bearbeitet, davon ${DB.perfect} fehlerfrei · längste Serie ${DB.streakBest} · ${totalStars()} Sterne</p>
    <h3>Lektionen</h3><div class="scroll"><table><tr><th>Kapitel</th><th>Lektion</th><th class="n">Runden</th><th class="n">Bestwert</th><th>Medaille</th><th>Fehlertypen</th></tr>
    ${ORDER.map(id => { const L = LES[id], m = medalOf(DB.best[id] || 0), ml = DB.misL[id] || {}; return `<tr><td>${L.ch + 1}</td><td>${L.name.replace(/­/g, '')}</td><td class="n">${DB.plays[id] || 0}</td><td class="n">${DB.best[id] ?? '–'}</td><td>${m ? MEDAL[m] : '–'}</td><td>${Object.entries(ml).filter(([k]) => MIS[k]).map(([k, v]) => `${MIS[k].n} (${v})`).join(', ') || '–'}</td></tr>`; }).join('')}</table></div>
    <h3>Typische Fehler und Förderhinweise</h3>${mis.length ? `<div class="mis">${mis.filter(([k]) => MIS[k]).map(([k, v]) => `<div><b>${MIS[k].n} – ${v}×</b>${MIS[k].t}</div>`).join('')}</div>` : '<p>Noch keine Fehler erfasst.</p>'}
    <h3>Letzte Runden</h3>${DB.log.length ? `<div class="scroll"><table><tr><th>Zeit</th><th>Lektion</th><th class="n">Sterne</th><th>Fehler in der Runde</th></tr>${DB.log.slice(0, 20).map(l => `<tr><td>${date(l.d)}</td><td>${LES[l.id] ? LES[l.id].name.replace(/­/g, '') : l.id}</td><td class="n">${l.s}</td><td>${Object.entries(l.mis || {}).filter(([k]) => MIS[k]).map(([k, v]) => `${MIS[k].n} (${v})`).join(', ') || '–'}</td></tr>`).join('')}</table></div>` : '<p>Noch keine Runden.</p>'}
    <h3>Zurücksetzen</h3><div class="confirm">${confirmReset ? '<span><b>Wirklich alle Daten dieses Geräts löschen?</b></span><button class="btn small" type="button" id="rsYes" style="border-color:var(--bad);color:var(--bad)">Ja, löschen</button><button class="btn small" type="button" id="rsNo">Abbrechen</button>' : '<button class="btn small" type="button" id="rs">Alle Daten löschen</button>'}</div>
    <p style="margin-top:12px;color:var(--ink-soft);font-size:14px">Die Daten werden nur auf diesem Gerät im Browser gespeichert.</p>`;
  $('rs')?.addEventListener('click', () => renderTeacher(true));
  $('rsNo')?.addEventListener('click', () => renderTeacher());
  $('rsYes')?.addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e){} loadDB(); renderTeacher(); renderHome(); });
}
$('bTeach').addEventListener('click', () => { renderPin(); $('dTeach').showModal(); });

/* ================= Start ================= */
$('bTheme').addEventListener('click', () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('tft-theme', r.dataset.theme); } catch (e){} });
try { const th = localStorage.getItem('tft-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e){}
$('hero').innerHTML = fig(blech({n: 5, fills: [[3, 'f1']], skin: 'kuchen', w: 160, h: 96}), fr(3, 5, 'c1')) + plus + fig(blech({n: 5, fills: [[1, 'f2']], skin: 'pizza', w: 160, h: 96}), fr(1, 5, 'c2'));
loadDB(); renderHome();
</script>

</body></html>
